<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/style.css">
<title>Dusty Bot — 3D Vacuum Roguelike</title>
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="hud-top">
    <div class="hud-left">
      <div id="lives"></div>
      <div id="room-label">Room 1</div>
    </div>
    <div class="hud-mid">
      <div id="dust-count">0</div>
      <div id="dust-sub">dust</div>
    </div>
    <div class="hud-right">
      <div id="battery-wrap"><div id="battery-fill"></div><span id="battery-pct">100</span></div>
      <div id="bin-wrap" title="Dust bin"><div id="bin-fill"></div><span>bin</span></div>
    </div>
  </div>
  <div id="room-progress"><div id="room-progress-fill"></div></div>
  <button id="btn-boost" class="touch-btn">BOOST</button>
  <button id="btn-mute" class="corner-btn" style="top:env(safe-area-inset-top)">♪</button>
</div>

<!-- Joystick -->
<div id="joy" class="hidden"><div id="joy-base"></div><div id="joy-knob"></div></div>

<!-- Menu / Hangar -->
<div id="screen-menu" class="screen">
  <h1>DUSTY BOT</h3>
  <p class="tag">a 3d vacuum roguelike</p>
  <div id="shard-bank"><span id="menu-shards">0</span> shards</div>
  <button id="btn-start" class="big">START RUN</button>
  <button id="btn-hangar" class="big small">HANGAR (upgrades)</button>
  <div id="offline-toast" class="hidden"></div>
  <div id="best-room" class="best">best room: 0</div>
  <div id="stats-line" class="best"></div>
</div>

<!-- Hangar / meta shop -->
<div id="screen-hangar" class="screen hidden">
  <h2>HANGAR</h2>
  <div id="hangar-shards"><span id="hangar-shards">0</span> shards</div>
  <div id="meta-list"></div>
  <button id="btn-back-menu" class="big small">back</button>
</div>

<!-- Upgrade pick -->
<div id="screen-pick" class="screen hidden">
  <h2 id="pick-title">ROOM CLEARED</h2>
  <p class="tag">pick an upgrade</p>
  <div id="pick-list"></div>
</div>

<!-- Run over -->
<div id="screen-over" class="screen hidden">
  <h2 id="over-title">RUN OVER</h2>
  <div id="over-stats" class="best"></div>
  <div id="over-shards" class="shards-gain"></div>
  <button id="btn-retry" class="big">RETRY</button>
  <button id="btn-over-menu" class="big small">HANGAR</button>
</div>

<div id="toast" class="hidden"></div>
</body>
<script type="module" src="./js/main.js"></script>
</html>
